# Generated from vercel.json by scripts/sync-headers.mjs. Do not edit by hand.
customHeaders:
  - pattern: "**/*"
    headers:
      - key: "Content-Security-Policy"
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://plus.unsplash.com https://images.pexels.com https://cdn.pixabay.com https://upload.wikimedia.org https://thumb.wikimedia.org; font-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://commons.wikimedia.org https://docs.google.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - key: "X-Frame-Options"
        value: "DENY"
      - key: "Permissions-Policy"
        value: "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), interest-cohort=()"
