<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons: the logo's cloche (scripts/make-icons.mjs). SVG first, PNG for older browsers. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Home-screen app. No "black-translucent" status bar: since iOS 26 the system
         draws a blur over the top of pages that run under a translucent status bar.
         The default style gives an opaque status bar tinted by theme-color (set per
         theme in theme-init.js / colorMode.js), and the page starts below it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SousChef" />
    <meta name="description" content="Recipe and pantry companion: track your pantry, cook from what you have, follow clear steps." />
    <meta property="og:title" content="SousChef — Cooking made easy" />
    <meta property="og:description" content="Track your pantry, cook from what you have, follow clear steps." />
    <meta property="og:image" content="/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F19" />
    <title>SousChef — Cooking made easy</title>
    <!-- Colour mode before first paint (blocking on purpose; same origin, no inline script). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="fluid-bg">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="blob b4"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
